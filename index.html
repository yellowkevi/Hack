<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grumbold's Trivia Tavern</title>
<style>
  :root {
    --bg: #1b130d; --panel: #2a1e14; --line: #4a3523; --text: #f3e6d3;
    --muted: #b49a7c; --gold: #f0b94a; --good: #7fcf7a; --bad: #e9695c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #3a2716, var(--bg) 60%);
    color: var(--text); font: 17px/1.5 Georgia, "Times New Roman", serif;
    display: flex; justify-content: center; padding: 16px;
  }
  main { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.5rem; color: var(--gold); letter-spacing: .5px; }
  .stats { display: flex; gap: 14px; color: var(--muted); font-size: .95rem; }
  .stats b { color: var(--gold); }
  #chat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .host { align-self: flex-start; background: #3b2a1b; border: 1px solid var(--line); }
  .host .who { color: var(--gold); font-weight: bold; font-size: .8rem; display: block; margin-bottom: 2px; }
  .player { align-self: flex-end; background: #2d3a2c; border: 1px solid #44603f; }
  .player .who { color: var(--good); font-weight: bold; font-size: .8rem; display: block; margin-bottom: 2px; }
  .question { align-self: stretch; max-width: 100%; text-align: center; border: 1px dashed var(--gold); color: var(--gold); }
  .right { border-left: 4px solid var(--good); }
  .wrong { border-left: 4px solid var(--bad); }
  .error { align-self: stretch; max-width: 100%; border: 1px solid var(--bad); color: var(--bad); }
  .typing { color: var(--muted); font-style: italic; }
  form, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], select {
    flex: 1; min-width: 0; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #20160e; color: var(--text); font: inherit;
  }
  button {
    padding: 11px 16px; border-radius: 8px; border: 0; background: var(--gold); color: #2a1a05;
    font: bold 1rem Georgia, serif; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  label { color: var(--muted); font-size: .9rem; }
  #status { color: var(--muted); font-size: .85rem; }
  @media (max-width: 520px) { body { font-size: 16px; } .msg { max-width: 95%; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>🍺 Grumbold's Trivia Tavern</h1>
    <div class="stats">
      <span>Score <b id="score">0</b></span>
      <span>Streak <b id="streak">0</b></span>
      <span>Q <b id="qnum">0</b>/<b id="qtotal">0</b></span>
    </div>
  </header>

  <div class="row">
    <label for="player">Contestant</label>
    <input type="text" id="player" placeholder="Name (e.g. Judge Dave)" maxlength="24" style="flex:0 1 180px">
    <label for="topic">Topic</label>
    <input type="text" id="topic" placeholder="Anything: 90s cartoons, space, cheese…" value="Random trivia" maxlength="80">
    <button id="start" type="button">Start game</button>
  </div>

  <div id="chat" aria-live="polite"></div>

  <form id="form" autocomplete="off">
    <input type="text" id="answer" placeholder="Your answer, if you dare…" disabled>
    <button id="submit" type="submit" disabled>Answer</button>
    <button id="skip" class="ghost" type="button" disabled>Skip</button>
  </form>

  <div class="row">
    <label for="model">Gemma model</label>
    <select id="model" style="flex:0 1 220px"></select>
    <button class="ghost" id="refresh" type="button">Refresh models</button>
    <span id="status"></span>
  </div>
</main>

<script>
const OLLAMA = "http://localhost:11434";
const QCOUNT = 5;
const $ = id => document.getElementById(id);
const chat = $("chat");
const state = { list: [], i: -1, score: 0, streak: 0, busy: false, active: false, log: [] };

const SYSTEM = `You are Grumbold, a stubborn, condescending tavern keeper hosting trivia night in a fantasy RPG tavern.
You roast contestants who answer wrong: funny, creative, PG-13, aimed at their answer and their earlier mistakes, never at protected traits or real hardship.
When they answer right you grudgingly concede while staying smug and unimpressed.
You remember the whole game and call back earlier answers.`;

function add(cls, text, who) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (who) { const w = document.createElement("span"); w.className = "who"; w.textContent = who; d.appendChild(w); }
  d.appendChild(document.createTextNode(text));
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

function setControls(on) { ["answer", "submit", "skip"].forEach(id => $(id).disabled = !on); if (on) $("answer").focus(); }
function updateStats() {
  $("score").textContent = state.score; $("streak").textContent = state.streak;
  $("qnum").textContent = Math.max(state.i + 1, 0); $("qtotal").textContent = state.list.length;
}

// ---- Gemma (Ollama) ----
async function gemma(messages, { json = false, tokens = 400, temperature = 1.0 } = {}) {
  const model = $("model").value;
  if (!model) throw new Error("No model selected. Is Ollama running?");
  const body = { model, stream: false, messages, options: { temperature, num_predict: tokens } };
  if (json) body.format = "json";
  const post = b => fetch(OLLAMA + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) });
  let r;
  try {
    // Skip Gemma's slow "thinking" phase; retry without the flag if the model rejects it.
    r = await post({ ...body, think: false });
    if (r.status === 400) r = await post(body);
  } catch {
    throw new Error("Can't reach Ollama at " + OLLAMA + ". Start it with: OLLAMA_ORIGINS=* ollama serve");
  }
  if (!r.ok) throw new Error("Ollama error " + r.status + ": " + (await r.text()).slice(0, 200));
  return (await r.json()).message.content.trim();
}

function parseJSON(text) {
  try { return JSON.parse(text); } catch {}
  const m = text.match(/[\[{][\s\S]*[\]}]/);
  if (m) return JSON.parse(m[0]);
  throw new Error("Gemma didn't return valid JSON.");
}

async function generateQuestions(topic) {
  const text = await gemma([
    { role: "system", content: "You write trivia questions. Output only JSON." },
    { role: "user", content: `Write ${QCOUNT} trivia questions about "${topic}", easy to medium difficulty, each with a short, unambiguous factual answer. Reply as JSON: {"questions":[{"q":"...","a":"..."}]}` },
  ], { json: true, tokens: 700, temperature: 0.8 });
  const data = parseJSON(text);
  const qs = (Array.isArray(data) ? data : data.questions || []).filter(x => x && x.q && x.a);
  if (!qs.length) throw new Error("Gemma didn't produce any questions.");
  return qs.slice(0, QCOUNT).map(x => ({ q: String(x.q), a: String(x.a) }));
}

// One call: Gemma judges the answer AND writes the in-character reaction.
async function judge(q, given, player) {
  const history = state.log.slice(-8).join("\n") || "(first question)";
  const text = await gemma([
    { role: "system", content: SYSTEM },
    { role: "user", content:
`Game so far:
${history}

Contestant: ${player}. Score ${state.score}, streak ${state.streak}.
Question: ${q.q}
Reference answer: ${q.a}
${player} said: "${given || "(skipped, gave up)"}"

Decide if it is correct (accept synonyms, spelling slips and equivalent phrasing; skipping is wrong).
Then write Grumbold's reaction in 1-3 short sentences, addressing ${player} by name. If wrong, reveal the correct answer. No emojis, no stage directions, no markdown.
Reply as JSON only: {"correct": true|false, "reply": "..."}` },
  ], { json: true, tokens: 250 });
  const d = parseJSON(text);
  return { correct: d.correct === true || d.correct === "true", reply: String(d.reply || "").trim() };
}

// ---- Game flow ----
function nextQuestion() {
  state.i++;
  if (state.i >= state.list.length) return finish();
  updateStats();
  add("question", `Question ${state.i + 1}: ${state.list[state.i].q}`);
  setControls(true);
}

async function finish() {
  state.active = false; updateStats();
  const player = $("player").value.trim() || "the contestant";
  const typing = add("host typing", "Grumbold tallies your shame…", "Grumbold");
  let text;
  try {
    text = await gemma([
      { role: "system", content: SYSTEM },
      { role: "user", content: `Trivia night is over. ${player} scored ${state.score}/${state.list.length}.\nGame log:\n${state.log.join("\n")}\nGive a final 2-3 sentence verdict and send them out of the tavern. No emojis, no markdown.` },
    ], { tokens: 200 });
  } catch { text = `That's the lot. ${state.score}/${state.list.length}. Now get out of my tavern.`; }
  typing.remove();
  add("host", `${text}\n\nFinal score: ${state.score}/${state.list.length}`, "Grumbold");
}

async function startGame() {
  if (state.busy) return;
  const topic = $("topic").value.trim() || "Random trivia";
  state.busy = true; setControls(false); $("start").disabled = true;
  chat.innerHTML = "";
  Object.assign(state, { list: [], i: -1, score: 0, streak: 0, log: [], active: false });
  updateStats();
  const typing = add("host typing", `Grumbold squints at the topic "${topic}" and scribbles some questions…`, "Grumbold");
  try {
    state.list = await generateQuestions(topic);
    typing.remove();
    add("host", `"${topic}", is it? Fine. Answer wrong and the whole tavern hears about it.`, "Grumbold");
    state.active = true;
    nextQuestion();
  } catch (e) {
    typing.remove(); add("error", e.message);
  } finally { state.busy = false; $("start").disabled = false; }
}

async function submitAnswer(given) {
  if (state.busy || !state.active) return;
  const player = $("player").value.trim() || "the contestant";
  const q = state.list[state.i];
  state.busy = true; setControls(false);
  if (given) add("player", given, player);
  const typing = add("host typing", "Grumbold is thinking of something cruel…", "Grumbold");
  try {
    const res = await judge(q, given, player);
    typing.remove();
    if (res.correct) { state.score++; state.streak++; } else state.streak = 0;
    state.log.push(`Q: ${q.q} | answer: ${q.a} | ${player} said: "${given || "skipped"}" | ${res.correct ? "CORRECT" : "WRONG"}`);
    add("host " + (res.correct ? "right" : "wrong"), res.reply || (res.correct ? "Correct. Don't gloat." : `Wrong. It was ${q.a}.`), "Grumbold");
    state.busy = false;
    nextQuestion();
  } catch (e) {
    typing.remove(); add("error", e.message + " (Try answering again.)");
    state.busy = false; setControls(true);
  }
}

// ---- Model picker ----
async function loadModels() {
  const sel = $("model"), prev = sel.value;
  $("status").textContent = "Looking for Ollama…";
  try {
    const r = await fetch(OLLAMA + "/api/tags");
    const names = (await r.json()).models.map(m => m.name);
    sel.innerHTML = "";
    names.forEach(n => sel.add(new Option(n, n)));
    const best = names.find(n => n === prev) || names.find(n => /gemma[-_:]?4/i.test(n)) || names.find(n => /gemma/i.test(n)) || names[0];
    if (best) sel.value = best;
    $("status").textContent = names.length ? `Connected · ${names.length} model(s)` : "Connected, but no models installed.";
  } catch {
    sel.innerHTML = "";
    $("status").textContent = "Ollama not reachable. Run: OLLAMA_ORIGINS=* ollama serve";
  }
  try { if (sel.value) localStorage.setItem("grumbold-model", sel.value); } catch {}
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("answer").value.trim();
  if (!v) return;
  $("answer").value = "";
  submitAnswer(v);
});
$("skip").addEventListener("click", () => submitAnswer(""));
$("start").addEventListener("click", startGame);
$("refresh").addEventListener("click", loadModels);
$("topic").addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });

add("host", "Welcome to my tavern. Enter a name and a topic, press Start game, and try not to embarrass yourself.", "Grumbold");
loadModels();
</script>
</body>
</html>
